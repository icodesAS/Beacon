spring.application.name=beacon-backend
server.port=8080

# Plain JDBC configuration (overridden by environment variables when set)
app.db.url=${DB_URL:jdbc:mysql://localhost:3306/beacon?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&forceConnectionTimeZoneToSession=true}
app.db.user=${DB_USER:root}
app.db.password=${DB_PASSWORD:}

# Swagger / OpenAPI UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Session cookie settings (2 hours, HttpOnly, SameSite=Lax)
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
